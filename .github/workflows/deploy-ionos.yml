name: Deploy to IONOS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to IONOS
        env:
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          set -e
          TMP_DIR=$(mktemp -d)
          cp -r api/ "$TMP_DIR/"
          cp index.html "$TMP_DIR/"
          cp package.json "$TMP_DIR/" 2>/dev/null || true

          echo "Conectando a IONOS..."
          sshpass -p "$IONOS_SFTP_PASSWORD" sftp -o StrictHostKeyChecking=no -o Port=22 su1224881@access-5019015320.webspace-host.com <<EOF
          cd /OSINT
          mkdir -p api
          put -r $TMP_DIR/api/* api/ 2>/dev/null || true
          put $TMP_DIR/index.html index.html
          put $TMP_DIR/package.json package.json 2>/dev/null || true
          bye
          EOF

          rm -rf "$TMP_DIR"
          echo "::notice::Despliegue completado en /OSINT"
