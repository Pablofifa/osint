name: Deploy to IONOS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to IONOS
        env:
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          echo "Conectando a IONOS..."
          sftp -o StrictHostKeyChecking=no -o Port=22 -b - su1224881@access-5019015320.webspace-host.com <<EOF
          cd /OSINT
          mkdir -p api
          put -r api/* api/
          put index.html
          put package.json
          bye
          EOF
          echo "::notice::Despliegue completado en /OSINT"
